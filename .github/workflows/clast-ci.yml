name: Clast CI

# Build + test the Clast support libraries (Core/Apis/Auth) and the transformed Storage.v1 test clients,
# and build the transformed generated REST clients (Storage.v1, Bigquery.v2) on every OS.
# Tests run with the Clast flag OFF (default) so the assemblies keep their original identity and the suites
# behave exactly as upstream. net8.0/net10.0 run on all three OSes; net472 (Windows only) is selected
# automatically by the test projects.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        shell: bash
        run: |
          set -e
          dotnet test Src/Support/Google.Apis.Tests/Google.Apis.Tests.csproj -c Release
          dotnet test Src/Support/Google.Apis.Auth.Tests/Google.Apis.Auth.Tests.csproj -c Release

      # The transformed generated REST clients aren't compiled into the test projects, so build them
      # directly (all TFMs, net10 with IsAotCompatible) to catch source-gen / AOT regressions per OS.
      - name: Build generated clients
        shell: bash
        run: |
          set -e
          dotnet build Src/Generated/Google.Apis.Storage.v1/Google.Apis.Storage.v1.csproj -c Release
          dotnet build Src/Generated/Google.Apis.Bigquery.v2/Google.Apis.Bigquery.v2.csproj -c Release
